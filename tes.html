
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Galeri Foto</title>
</head>
<body>

    <h1 style="color: #0088cc;">Galeri Foto</h1>

    <p>
        Kumpulan dari beberapa foto teman-teman sekolah,
        foto pribadi, dan masa kecil.
    </p>

    <hr>

    <h3>Album 1 - Bersama Teman SMP</h3>

    <table width="100%" border="0">
        <tr align="center">
            <td>
                <img src="foto1.jpg" width="300" height="200"
                     alt="Foto 1">
                <p>Foto 1</p>
            </td>
            <td>
                <img src="foto2.jpg" width="300" height="200"
                     alt="Foto 2">
                <p>Foto 2</p>
            </td>
            <td>
                <img src="foto3.jpg" width="300" height="200"
                     alt="Foto 3">
                <p>Foto 3</p>
            </td>
        </tr>
    </table>

    <details>
        <summary><b>Selengkapnya</b></summary>

        <h3>Album 2 - Kenangan Lainnya</h3>

        <table width="100%" border="0">
            <tr align="center">
                <td>
                    <img src="foto4.jpg" width="300" height="200"
                         alt="Foto 4">
                    <p>Foto 4</p>
                </td>
                <td>
                    <img src="foto5.jpg" width="300" height="200"
                         alt="Foto 5">
                    <p>Foto 5</p>
                </td>
                <td>
                    <img src="foto6.jpg" width="300" height="200"
                         alt="Foto 6">

</html>
